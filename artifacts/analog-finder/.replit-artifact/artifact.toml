kind = "web"
previewPath = "/"
title = "Terrestrial Analog Finder"
description = "A NASA Space Apps 2026 web app that compares candidate Moon and Mars locations with terrestrial analog sites on Earth. Users pick a Moon or Mars base, see ranked Earth analogs on a map with a global heat layer and a Discoveries list, compare sites per-target and in an all-targets matrix, and adjust comparison weights."
version = "1.0.0"
id = "artifacts/analog-finder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22716

[services.development]
run = "pnpm --filter @workspace/analog-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/analog-finder", "run", "build" ]
serve = "static"
publicDir = "artifacts/analog-finder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22716"
BASE_PATH = "/"
